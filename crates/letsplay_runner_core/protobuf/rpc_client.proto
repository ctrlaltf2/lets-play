// This .proto contains definitions that are used for communication between
// letsplayd and a runner process.
//
// These are relevant protos for implementing a RPC client (like a game).
edition = "2023";

// The type of an input device.
enum InputDeviceType {
	// A joypad (probably the default).
	JOYPAD = 0;

	// Analog joypad.
	JOYPAD_ANALOG = 1;

	// Keyboard and mouse.
	KB_MOUSE = 2;
}

// Joystick input.
message JoystickInput {
	message Stick {
		float x = 2;
		float y = 3;
	}

	// Buttons. It is assumed that 64 bits of buttons will be enough,
	// but I am providing a gap in this message to put more fields if needed.
	// Later on these should probably be defined somewhere or something.
	fixed64 buttons = 1;

	// Sticks are sent in order (and always for the correct count of joysticks).
	// If the current input device is not JOYPAD_ANALOG, then sticks will be ignored
	// even if they are sent by the server to us.
	repeated Stick sticks = 10;
}

message KbMouseInput {
	message Keyboard {
		message Key {
			uint32 keysym = 1;
			bool pressed = 2;
		}

		repeated Key keys = 1;
	}

	message Mouse {
		uint32 x = 1;
		uint32 y = 2;
		uint32 buttons = 3;
	}

	// Present if keyboard input changed
	Keyboard kb = 1;

	// Present if mouse input changed.
	Mouse mouse = 2;
}


// A request made by letsplayd
message ServerMessage {

	// Shut down the runner's game.
	message Shutdown {}

	// Reset the currently running game game 
	message Reset {}

	// Controls the runner's suspend flag.
	//
	// Setting this flag to true tells the runner to (temporarily) inhibit the
	// runner thread from executing, thereby "suspending" emulation. (Additionally, 
	// while suspended, we should disable certain other routine tasks, and re-enable them
	// when leaving suspend. )
	// 
	// Likewise, false turns off the suspend flag, and allows the runner thread to run.
	//
	// Ideally this could be done if the emulator node the runner is for is empty after
	// a certain period of time.
	message SetSuspend {
		bool suspend = 1;
	}

	// Inserts (plugs in) a input device. This typically occurs only at the start of a game
	// (for the amount of players configured).
	message PlugInputDevice {
		int32 index = 1;
		InputDeviceType type = 2;
	}

	// "Unplugs" (removes) an input device. 
	message UnplugInputDevice {
		int32 index = 1;
	}

	// Provides new inputs for an input device.
	message UpdateInputDevice {
		// The device index to update with new inputs.
		int32 index = 1;

		// The input to update. A invalid input type will be silently ignored.
		oneof InputKind {
			JoystickInput joy_input = 2;
			KbMouseInput kbm_input = 3;
		}
	}
	
	// Requests a new video keyframe.
	message VideoRequestKeyFrame {}

	oneof Oneof {
		// Control
		Shutdown shutdown = 1;
		Reset reset = 2;

		// Configuration
		SetSuspend set_suspend = 4;

		// Input
		PlugInputDevice plug_input_device = 6;
		UnplugInputDevice unplug_input_device = 7;
		UpdateInputDevice update_input_device = 8;

		// A/V
		VideoRequestKeyFrame video_request_key_frame = 9;
	}
}
