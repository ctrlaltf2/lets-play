[workspace]
resolver = "2"
members = [
	# "Foundation" libraries. These basically are used
	# by the rest of the letsplay repo to do certain things.
	"crates/letsplay_core",
	"crates/letsplay_gpu",
	"crates/letsplay_av_ffmpeg",

	# Libretro frontend library
	"crates/letsplay_libretro_sys",
	"crates/letsplay_retro_frontend",
	"crates/retrodemo",

	# Runner libraries
	"crates/letsplay_runner_core",
	"crates/letsplay_runner_retro",

	"crates/letsplayd"
]

# Default package fields. We forbid publishing by default
# since a lot of the crates we build here aren't really useful
# outside of the Let's Play codebase, however some are.
[workspace.package]
publish = false
version = "0.1.0-alpha0"
edition = "2021"


[workspace.dependencies]
# Error handling
anyhow = "1.0.86"
thiserror = "2.0.11"

# dynamic linking stuff
libc = "0.2.155"
libloading = "0.8.5"

bytes = "1.9.0"

# CLI parsing
clap = { version = "4.5.6", features = ["cargo"] }

# Async stuff
tokio = { version = "1.37.0", features = [ "full" ] }
tokio-util = { version = "0.7.13" }
futures = "0.3.31"
futures-util = "0.3.31"

# Tracing
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

# OpenGL stuff
gl = "0.14.0"
gl_generator = "0.14.0"

# TODO: Cap'n Proto

# Serde
serde = { version = "1.0.204", features = ["derive"] }
serde_json = { version = "1.0.138" }
toml = "0.8.19"

# NVIDIA-specific dependencies
#
# FIXME: Bump cudarc to CUDA 12.2; we already rely on
# at least SM60 (Pascal) minimum support, since
# nvRTC will only gencode for SM60 onwards.
cudarc = { version = "0.13.3", features = [ "cuda-11050" ] }

[patch.crates-io]
ffmpeg = { version = "7.1.0", package = "ffmpeg-next", git = "https://github.com/hgaiser/rust-ffmpeg", branch = "codec-context-settable" }
ffmpeg-sys-next = { version = "7.1.0", git = "https://github.com/hgaiser/rust-ffmpeg-sys", branch = "cuda" }
