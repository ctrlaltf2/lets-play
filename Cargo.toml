[workspace]
resolver = "2"
members = [
	"crates/letsplay_gpu",
	"crates/letsplay_av_ffmpeg",

	"crates/letsplay_retro_frontend",
	"crates/retrodemo",

	"crates/letsplay_runner_core",
	"crates/letsplay_runner_retro",

	"crates/letsplayd"
]

# Default package fields. We forbid publishing by default
# since a lot of the crates we build here aren't really useful
# outside of the Let's Play codebase, however some are.
[workspace.package]
publish = false
version = "0.1.0-alpha0"
edition = "2021"


[workspace.dependencies]
anyhow = "1.0.86"

libc = "0.2.155"

clap = { version = "4.5.6", features = ["cargo"] }

tokio = { version = "1.37.0", features = [ "full" ] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
thiserror = "1.0.61"

gl = "0.14.0"
gl_generator = "0.14.0"

[patch.crates-io]
ffmpeg = { version = "7.1.0", package = "ffmpeg-next", git = "https://github.com/hgaiser/rust-ffmpeg", branch = "codec-context-settable" }
ffmpeg-sys-next = { version = "7.1.0", git = "https://github.com/hgaiser/rust-ffmpeg-sys", branch = "cuda" }
